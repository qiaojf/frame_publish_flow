server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # FastAPI enforces the exact per-file limit (10 MB by default). Keep the
  # proxy envelope above it so multipart overhead is not rejected by Nginx.
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /storage/ {
    proxy_pass http://api:8000;
  }

  location /videos-pub/ {
    proxy_pass http://api:8000;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # index.html points to content-hashed JS assets and must always be revalidated
  # after a deployment. This prevents an older UI bundle surviving a rebuild.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
